name: Temporary baseline verification

on:
  push:
    branches:
      - work

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Normalize candidate and sync Rules 3.0.0
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from urllib.request import urlopen
          import hashlib
          import json
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo

          rules_commit = "fa23243ab0f5b7c63c32f83f86c2de55dd42bd54"
          base = f"https://raw.githubusercontent.com/Shota-Zaki/development-rules/{rules_commit}/"

          def fetch(source: str, target: str) -> None:
              data = urlopen(base + source, timeout=30).read()
              path = Path(target)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(data)

          # Small source-contract repairs found by the first CI run.
          server = Path("src/mcp/server.ts")
          text = server.read_text(encoding="utf-8")
          old = "repository is required. path is repository-relative. ${UNTRUSTED_NOTE}"
          new = "repository is required. path is repository-relative. When hasMore is true, call again with offset=nextOffset. ${UNTRUSTED_NOTE}"
          if old in text:
              text = text.replace(old, new, 1)
              server.write_text(text, encoding="utf-8")

          skill = Path("skill/SKILL.md")
          text = skill.read_text(encoding="utf-8")
          old = "1. In the shared hardened checkout, `git status --porcelain`. If dirty, stop;\n   never stash/reset/discard automatically."
          new = "1. In the shared hardened checkout, `git status --porcelain`. If dirty, stop.\n   Never stash, reset, discard, or overwrite local changes."
          if old in text:
              text = text.replace(old, new, 1)
              skill.write_text(text, encoding="utf-8")

          test = Path("tests/skill-update-hardening.test.ts")
          text = test.read_text(encoding="utf-8")
          text = text.replace(
              '    expect(skill).toContain("one shared hardened checkout");\n    expect(skill).toContain("one repository per workspace boundary");',
              '    expect(skill).toContain("one shared hardened C2C checkout per machine");\n'
              '    expect(skill).toContain("Workspace is the authorization boundary");\n'
              '    expect(skill).toContain("Multi-repository Workspaces are allowed");\n'
              '    expect(skill).not.toContain("one repository per workspace boundary");'
          )
          test.write_text(text, encoding="utf-8")

          cli = Path("src/cli/index.ts")
          text = cli.read_text(encoding="utf-8")
          marker = '// ---------------------------------------------------------------- update-check (once per local day)'
          head, tail = text.split(marker, 1)
          old = '    env: { ...process.env, GIT_TERMINAL_PROMPT: "0" },\n  });\n  return { ok:'
          new = '    env: { ...process.env, GIT_TERMINAL_PROMPT: "0" },\n    windowsHide: true,\n  });\n  return { ok:'
          if old in tail:
              tail = tail.replace(old, new, 1)
          cli.write_text(head + marker + tail, encoding="utf-8")

          # Synchronize the formal Rules 3.0.0 Snapshot used by project-state validation.
          fetch("docs/rules/manifest.json", "docs/rules/manifest.json")
          rule_files = [
              "AI_EXECUTION_STANDARD.md", "CHATGPT_EXECUTION_STANDARD.md",
              "CHAT_COMMAND_STANDARD.md", "CODEX_EXECUTION_STANDARD.md",
              "CONTEXT_HANDOFF_STANDARD.md", "DEVELOPMENT_RULES.md",
              "NEW_REPOSITORY_STANDARD.md", "OUTPUT_QUALITY_STANDARD.md",
              "REPOSITORY_STANDARD.md", "TASK_STANDARD.md",
              "VERIFICATION_STANDARD.md", "VERSIONING_STANDARD.md", "WORKFLOW.md",
          ]
          for name in rule_files:
              fetch(f"docs/rules/{name}", f"docs/rules/{name}")
          fetch("scripts/rules_common.py", "scripts/rules/rules_common.py")
          fetch("scripts/check-project-state.py", "scripts/rules/check-project-state.py")
          fetch("scripts/check-rule-package.py", "scripts/rules/check-rule-package.py")

          manifest = json.loads(Path("docs/rules/manifest.json").read_text(encoding="utf-8"))
          delivery = {"docs/rules/manifest.json": "docs/rules/manifest.json"}
          for source in manifest["rule_owners"].values():
              delivery[source] = source
          for entry in manifest["support_files"]:
              delivery[entry["target"]] = entry["source"]
          hashes = {
              target: hashlib.sha256(Path(target).read_bytes()).hexdigest()
              for target in delivery
          }
          recorded_at = datetime.now(timezone.utc).astimezone(ZoneInfo("Asia/Tokyo")).isoformat(timespec="seconds")
          record = {
              "schema_version": 1,
              "rules_version": manifest["rules_version"],
              "source_repository": "Shota-Zaki/development-rules",
              "source_branch": "main",
              "source_commit": rules_commit,
              "synced_at": recorded_at,
              "files": hashes,
          }
          Path("docs/rules/RULES_SOURCE.md").write_text(
              "# Rules Source\n\n```json\n" + json.dumps(record, ensure_ascii=False, indent=2) + "\n```\n",
              encoding="utf-8",
          )

          Path("AGENTS.md").write_text("""# AGENTS.md

Project固有仕様は `docs/project/PROJECT_BRIEF.md` と `docs/design/`。適用Rulesは `docs/rules/RULES_SOURCE.md`。
共通の開始手順は `docs/rules/AI_EXECUTION_STANDARD.md`、終了契約は `docs/rules/WORKFLOW.md`。
現在Taskは `docs/project/TASKS.md`、次の1 Work Unitは `docs/project/NEXT_WORK.md`、再開上の注意は `docs/project/AI_WORK_STATE.md`。

## Project固有差分

- ChatGPT側C2C MCPはread-onlyを維持し、編集・shell・Git mutation・test/build等のSoftware Engineering実行はCodexが担当する。
- WorkspaceはOAuth/token/bridgeの認可境界、Repository ContextはGit/Executionの識別境界とする。
- upstreamは単純mergeせず、Hardened ForkのSecurity・日本語化・手動検証Update方針へ変更単位でAdaptする。

## 検証入口

```sh
corepack pnpm install --frozen-lockfile
corepack pnpm test
corepack pnpm typecheck
corepack pnpm build
python scripts/rules/check-project-state.py --root .
```

Work Unit終了時はWorkflowに従い、必要なEvidenceと正本を同期する。
""", encoding="utf-8")
          PY

          if ! git diff --quiet -- . ':(exclude).github/workflows/verify-baseline.yml'; then
            git config user.name "Shota-Zaki"
            git config user.email "246847859+Shota-Zaki@users.noreply.github.com"
            git add AGENTS.md docs/rules scripts/rules src/mcp/server.ts src/cli/index.ts skill/SKILL.md tests/skill-update-hardening.test.ts
            git commit -m "chore: normalize baseline contracts and rules snapshot"
            git push origin HEAD:work
          fi
      - name: Enable Corepack
        run: corepack enable
      - name: Frozen install
        run: corepack pnpm install --frozen-lockfile
      - name: Test
        run: corepack pnpm test
      - name: Typecheck
        run: corepack pnpm typecheck
      - name: Build
        run: corepack pnpm build
