name: Temporary baseline finalization

on:
  push:
    branches:
      - work

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack
        run: corepack enable

      - name: Frozen install
        run: corepack pnpm install --frozen-lockfile

      - name: Test
        run: corepack pnpm test

      - name: Typecheck
        run: corepack pnpm typecheck

      - name: Build
        run: corepack pnpm build

      - name: Finalize canonical state
        run: python scripts/finalize-baseline.py

      - name: Commit verified baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Shota-Zaki"
          git config user.email "246847859+Shota-Zaki@users.noreply.github.com"
          git add -A
          git commit -m "chore: finalize hardened multi-repository baseline"
          git push origin HEAD:work

      - name: Verify committed state
        run: |
          python scripts/rules/check-project-state.py --root .
          test -z "$(git status --porcelain)"
