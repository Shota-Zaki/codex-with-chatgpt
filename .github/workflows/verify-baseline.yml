name: Temporary baseline verification

on:
  push:
    branches:
      - work

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply late-pairing baseline
        shell: bash
        run: |
          set -euo pipefail
          python scripts/apply-late-pairing-baseline.py
          if ! git diff --quiet -- src/cli/index.ts skill/SKILL.md tests/doctor-late-pairing.test.ts || [ -n "$(git ls-files --others --exclude-standard tests/doctor-late-pairing.test.ts)" ]; then
            git config user.name "Shota-Zaki"
            git config user.email "246847859+Shota-Zaki@users.noreply.github.com"
            git add src/cli/index.ts skill/SKILL.md tests/doctor-late-pairing.test.ts
            git commit -m "fix: defer reconnect pairing until authorization"
            git push origin HEAD:work
          fi

      - name: Enable Corepack
        run: corepack enable

      - name: Frozen install
        run: corepack pnpm install --frozen-lockfile

      - name: Test
        run: corepack pnpm test

      - name: Typecheck
        run: corepack pnpm typecheck

      - name: Build
        run: corepack pnpm build
